<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HemoRed — Elegir plan</title>
  <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../estilos/publico.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

</head>
<body>

<nav>
  <a class="nav-logo" href="../index.html">Hemo<span>red</span></a>
  <div class="nav-public-links">
    <a href="../index.html">Home</a>
    <a href="nosotros.html">Nosotros</a>
  </div>
  <button class="burger-btn" onclick="document.getElementById('mobile-menu').classList.toggle('active')" aria-label="Menú">
    <span></span><span></span><span></span>
  </button>
</nav>

<main class="elegir-plan">
  <div class="form-card">
    <button class="form-back" onclick="window.location='pago.html'">
      <i class="ti ti-arrow-left" aria-hidden="true"></i> Volver al pago
    </button>
    <div class="form-title">Elegí tu plan</div>
    <div class="form-subtitle">Cambiá de plan sin perder los datos de tu institución ya cargados.</div>

    <div class="planes-grid" id="planes-grid-elegir">
    </div>

    <div class="plan-especial" onclick="window.location='contacto.html'">
      <div class="plan-especial-info">
        <div class="plan-especial-icon">
          <i class="ti ti-message" aria-hidden="true"></i>
        </div>
        <div>
          <div class="plan-especial-title">¿Necesitás un plan especial?</div>
          <div class="plan-especial-desc">Redes de hospitales, ministerios o necesidades particulares. Contactanos.</div>
        </div>
      </div>
      <i class="ti ti-arrow-right" aria-hidden="true"></i>
    </div>

    <button class="form-btn" onclick="confirmarPlan()">Confirmar y volver al pago</button>
  </div>
</main>

<footer>
  <div class="footer-logo"><a href="../index.html">Hemo<span>red</span></a></div>
  <div class="footer-copy">© 2026 HemoRed</div>
</footer>

<script src="../js/db.js"></script>
<script src="../js/data.js"></script>
<script>
  // Planes reales (2026-11-17) — mismas funciones que registro.html y
  // publico/planes.html, duplicadas a propósito (ver nota en registro.html).
  let planElegido = Number(sessionStorage.getItem('hemored_plan_elegido')) || null;
  let planesCache = [];

  function esPromoVigenteElegir(plan) {
    if (!plan.es_promo || !plan.fecha_inicio_promo || !plan.fecha_fin_promo) return false;
    const hoy = new Date();
    return hoy >= new Date(plan.fecha_inicio_promo) && hoy <= new Date(plan.fecha_fin_promo + 'T23:59:59');
  }

  function tarjetaPlanElegir(plan) {
    const esGratuito = plan.precio_base === 0;
    const esRecomendado = plan.nombre === 'Profesional';
    const promoVigente = esPromoVigenteElegir(plan);
    const precio = promoVigente ? plan.precio_promo : plan.precio_base;
    const precioHtml = esGratuito
      ? `<div class="plan-price">Gratis</div>`
      : `<div class="plan-price">$${precio.toLocaleString('es-AR')} <span>/ mes + IVA</span></div>`;
    const features = esGratuito
      ? ['Sin costo de suscripción', 'Participa en campañas a las que te inviten', 'Gestión de turnos y profesionales (sin pacientes propios)']
      : [
          plan.max_campanas_simultaneas >= 999 ? 'Campañas ilimitadas' : `Hasta ${plan.max_campanas_simultaneas} campañas activas simultáneas`,
          `Alcance ${plan.alcance}`,
          'Gestión de turnos, pacientes y profesionales',
          'Dashboard de métricas',
          'Carga de documentación clínica',
        ].concat(plan.nombre === 'Premium' ? ['Soporte prioritario'] : []);

    return `
      <div class="plan-card selectable${plan.id === planElegido ? ' selected' : ''}" data-plan="${plan.id}" onclick="seleccionarPlan(${plan.id}, this)">
        <div class="plan-check"><i class="ti ti-check" aria-hidden="true"></i></div>
        ${esRecomendado ? '<div class="plan-badge-top">Recomendado</div>' : ''}
        ${esGratuito ? '<div class="plan-badge-top" style="background:#27ae60;">Nuevo</div>' : ''}
        <div class="plan-name">${plan.nombre}</div>
        ${precioHtml}
        <ul class="plan-features">
          ${features.map(f => `<li><i class="ti ti-check" aria-hidden="true"></i>${f}</li>`).join('')}
        </ul>
      </div>`;
  }

  async function renderPlanesElegir() {
    await HemoRed.db.init();
    planesCache = HemoRed.db.all('planes').filter(p => p.activo).sort((a, b) => a.id - b.id);
    if (!planElegido) planElegido = (planesCache.find(p => p.nombre === 'Profesional') || planesCache[0])?.id;
    document.getElementById('planes-grid-elegir').innerHTML = planesCache.map(tarjetaPlanElegir).join('');
  }
  document.addEventListener('DOMContentLoaded', renderPlanesElegir);

  function seleccionarPlan(planId, el) {
    planElegido = planId;
    document.querySelectorAll('.plan-card.selectable').forEach(c => c.classList.toggle('selected', Number(c.dataset.plan) === planId));
  }

  function confirmarPlan() {
    sessionStorage.setItem('hemored_plan_elegido', String(planElegido));
    const plan = planesCache.find(p => p.id === planElegido);
    window.location = (plan && plan.precio_base === 0) ? 'cuenta_pendiente.html' : 'pago.html';
  }
</script>
</body>
</html>
