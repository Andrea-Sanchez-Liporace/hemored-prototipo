<body>

<!-- NAV -->
<nav>
  <a class="nav-logo" href="../index.html">Hemo<span>red</span></a>
  <div class="nav-public-links">
    <a href="../index.html">Home</a>

  </div>

  <a href="../index.html#como-funciona">Cómo funciona</a>
  <a href="../index.html#para-hospitales">Para hospitales</a>

</div>

<!-- MAIN -->
<main>
  <div class="form-card">
    <div class="form-logo">Hemo<span>red</span></div>
    <div class="form-subtitle" id="form-subtitle">Iniciá sesión en tu cuenta</div>
    <div class="form-rol-badge" id="form-rol-badge" style="display:none;">
      <div class="icon" id="form-rol-icon"></div>
      <div class="label" id="form-rol-label"></div>
    </div>

    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input class="form-input" id="email" type="email" placeholder="tu@email.com">
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Contraseña</label>
      <input class="form-input" id="password" type="password" placeholder="••••••••">
    </div>

    <a class="form-forgot" href="../publico/recuperar.html">¿Olvidaste tu contraseña?</a>

    <button class="form-btn" onclick="login()">Iniciar sesión</button>

    <div id="login-error" style="display:none;background:#fde8e8;border:1px solid #c0392b;border-radius:9px;padding:10px 14px;margin-top:12px;font-size:13px;color:#c0392b;text-align:center;">
      Email o contraseña incorrectos.
    </div>

    <div class="form-divider"><span>¿No tenés cuenta?</span></div>

    <button class="form-register" onclick="window.location='../publico/registro.html'">Crear cuenta gratis</button>

    <p class="form-footer-note">Registrarse es gratis para donantes · Planes mensuales para instituciones</p>
  </div>
</main>

<!-- FOOTER -->
<footer>
  <div class="footer-logo"><a href="../index.html">Hemo<span>red</span></a></div>
  <div class="footer-links">
    <a href="../publico/terminos.html">Términos</a>
    <a href="../publico/privacidad.html">Privacidad</a>
    <a href="../publico/contacto.html">Contacto</a>
  </div>
  <div class="footer-copy">© 2026 HemoRed</div>
</footer>

<script>
  // Usuarios de demo — en producción esto lo resuelve el backend
  const usuarios = {
    'donante@hemored.com':      { pass: 'donante123',   rol: 'donante',      dest: '../donante/dashboard.html' },
    'hospital@hemored.com':     { pass: 'hospital123',  rol: 'hospital',     dest: '../hospital/dashboard.html' },
    'profesional@hemored.com':  { pass: 'prof123',      rol: 'profesional',  dest: '../profesional/dashboard.html' },
    'admin@hemored.com':        { pass: 'admin123',     rol: 'equipo_hemored', dest: '../admin/dashboard.html' },
  };

  // Contexto por rol — viene del botón elegido en el home (¿Cómo querés ingresar?)
  const contextoRol = {
    donante:  { icono: 'ti-heart',             color: '#ef647c', label: 'Ingresando como donante',  email: 'donante@hemored.com' },
    hospital: { icono: 'ti-building-hospital', color: '#5a1e37', label: 'Ingresando como hospital',  email: 'hospital@hemored.com' },
  };

  (function aplicarContextoRol() {
    const rol = new URLSearchParams(window.location.search).get('rol');
    const ctx = contextoRol[rol];
    if (!ctx) return;
    document.getElementById('form-subtitle').textContent = 'Accedé a tu cuenta para continuar';
    document.getElementById('form-rol-badge').style.display = 'flex';
    document.getElementById('form-rol-icon').style.background = ctx.color;
    document.getElementById('form-rol-icon').innerHTML = `<i class="ti ${ctx.icono}" style="color:white;font-size:15px;"></i>`;
    document.getElementById('form-rol-label').textContent = ctx.label;
    document.getElementById('email').value = ctx.email;
    document.getElementById('password').focus();
  })();

  function login() {
    const email = document.getElementById('email').value.trim().toLowerCase();
    const pass  = document.getElementById('password').value;
    const error = document.getElementById('login-error');
    const result = HemoRed.sesion.login(email, pass);
    if (result.ok) {
      error.style.display = 'none';
      window.location.href = result.dest;
    } else {
      error.style.display = 'block';
    }
  }

  // Enter key support
  document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
</script>
  <script src="../js/db.js"></script>
  <script src="../js/sesion.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/data.js"></script>
</body>
</html>
