<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HemoRed — Notificaciones</title>
  <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../estilos/global.css">
  <link rel="stylesheet" href="../estilos/componentes.css">
  <link rel="stylesheet" href="../estilos/donante.css">




</head>
<body>

<aside class="sidebar" id="sidebar"></aside>

<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="mobile-topbar-btn"><span></span><span></span><span></span></button>
      <div class="topbar-title">Notificaciones</div>
    </div>
    <div class="topbar-actions">
      <button class="topbar-btn" onclick="marcarTodasLeidasUI()" data-tooltip="Marcar todas como leídas">
        <i class="ti ti-checks" style="font-size:18px;" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  <div class="content">

    <div class="tabs">
      <button class="tab active" onclick="filtrarNotif('todas', this)">Todas</button>
      <button class="tab" onclick="filtrarNotif('noleidas', this)">No leídas</button>
      <button class="tab" onclick="filtrarNotif('turnos', this)">Turnos</button>
      <button class="tab" onclick="filtrarNotif('documentos', this)">Documentos</button>
      <button class="tab" onclick="filtrarNotif('campanas', this)">Campañas</button>
    </div>

    <div id="sin-resultados-notif" class="hidden" style="padding:40px;text-align:center;color:#a9435d;font-size:14px;">Sin resultados</div>

    <div id="lista-notificaciones"><!-- renderizado dinámico vía HemoRed.data.cargarNotificacionesDonante() --></div>

  </div>
</div>

<!-- Respuesta ya enviada al formulario post-donación (F4) — solo lectura.
     No hay sesión/identidad vinculada a la respuesta en sí (es anónima, ver
     docs/01), así que esto muestra lo guardado en formulario_postdonacion
     buscando por token, el mismo dato que ya vive en la notificación. -->
<div class="modal-overlay" id="modal-ver-f4">
  <div class="modal" style="max-width:420px;">
    <div class="modal-header">
      <div class="modal-title">Tu respuesta</div>
      <button class="modal-close" onclick="HemoRed.ui.cerrarModal('modal-ver-f4')"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body" id="ver-f4-body"></div>
  </div>
</div>

<script>
  let notificacionesActuales = [];
  let filtroActual = 'todas';

  // Colores por "tono" (definido en cada notificación, ej. rosa/verde/
  // naranja/rojo) — así una notificación creada dinámicamente (ej. al
  // rechazar una solicitud de corrección, ver data.js) se ve consistente
  // con las que vienen de datos semilla, sin tener que repetir el estilo
  // completo en cada lugar que crea una.
  const TONOS_NOTIF = {
    rosa:    { bg: '#fdf0f3', border: '0.5px solid #f28b98', color: '#ef647c' },
    verde:   { bg: '#e1f5ee', border: 'none', color: '#27ae60' },
    naranja: { bg: '#faeeda', border: 'none', color: '#e67e22' },
    rojo:    { bg: '#fde8e8', border: 'none', color: '#c0392b' },
  };
  const TITULOS_GRUPO = { hoy: 'Hoy', ayer: 'Ayer', semana: 'Esta semana', antes: 'Más antiguas' };

  async function cargarYRenderizarNotif() {
    await HemoRed.db.init();
    const s = HemoRed.sesion.requerirLogin('donante');
    if (!s) return;
    await HemoRed.data.verificarPerfilIncompleto();
    notificacionesActuales = await HemoRed.data.cargarNotificacionesDonante();

    // El F4 se responde en una pestaña nueva, sin pasar por el click en la
    // fila (el botón hace stopPropagation) — sin esto, el puntito de "no
    // leída" quedaba para siempre aunque ya no hubiera nada pendiente.
    notificacionesActuales
      .filter(n => !n.leido && (n.accion_url || '').includes('postdonacion_anonimo.html'))
      .forEach(n => {
        const tok = tokenDeAccionUrl(n.accion_url);
        const f = tok ? HemoRed.db.all('formulario_postdonacion').find(x => x.token === tok) : null;
        if (f?.completado_en) {
          HemoRed.data.marcarNotificacionLeida(n.id);
          n.leido = true;
        }
      });

    renderNotificaciones();
  }

  function horaCorta(fechaISO) {
    return new Date(fechaISO).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
  }
  function tiempoRelativo(n) {
    if (n.grupo === 'hoy') return horaCorta(n.fecha) + 'hs';
    if (n.grupo === 'ayer') return 'ayer a las ' + horaCorta(n.fecha) + 'hs';
    return new Date(n.fecha).toLocaleDateString('es-AR', { day: 'numeric', month: 'short' }) + ' · ' + horaCorta(n.fecha) + 'hs';
  }

  // El token del formulario post-donación (F4) viaja en la propia accion_url
  // (?token=...) — se usa tal cual para buscar si ya se respondió, sin
  // necesitar ningún otro vínculo (la respuesta en sí es anónima).
  function tokenDeAccionUrl(url) {
    const m = /[?&]token=([^&]+)/.exec(url || '');
    return m ? m[1] : null;
  }

  function notifItemHTML(n) {
    const tono = TONOS_NOTIF[n.tono] || TONOS_NOTIF.rosa;
    const esF4 = (n.accion_url || '').includes('postdonacion_anonimo.html');
    const tokenF4 = esF4 ? tokenDeAccionUrl(n.accion_url) : null;
    const f4Resp = tokenF4 ? HemoRed.db.all('formulario_postdonacion').find(f => f.token === tokenF4) : null;
    const f4YaRespondido = !!f4Resp?.completado_en;

    let accionHTML = '';
    if (esF4 && f4YaRespondido) {
      accionHTML = `<button class="notif-action notif-action-primary" onclick="event.stopPropagation();verRespuestaF4('${tokenF4}')">Ver</button>`;
    } else if (esF4) {
      // Abre en pestaña nueva: es un flujo sin sesión, pensado para volver
      // a la app (que sigue abierta en esta pestaña) apenas se completa.
      accionHTML = n.accion_texto ? `<button class="notif-action notif-action-primary" onclick="event.stopPropagation();window.open('${n.accion_url}','_blank')">${n.accion_texto}</button>` : '';
    } else if (n.accion_texto) {
      accionHTML = `<button class="notif-action notif-action-primary" onclick="event.stopPropagation();window.location='${n.accion_url}'">${n.accion_texto}</button>`;
    }

    return `
      <div class="notif-item ${n.leido ? '' : 'unread'}" data-tipo="${n.tipo}" onclick="marcarLeidaUI(${n.id})">
        <div class="notif-icon" style="background:${tono.bg};border:${tono.border};">
          <i class="ti ${n.icono}" style="color:${tono.color};font-size:20px;" aria-hidden="true"></i>
        </div>
        <div class="notif-body">
          <div class="notif-title">${n.titulo}</div>
          <div class="notif-desc">${n.descripcion}</div>
          <div class="notif-time">${tiempoRelativo(n)}</div>
        </div>
        <div class="notif-right">
          ${n.leido ? '' : '<div class="unread-dot"></div>'}
          ${accionHTML}
        </div>
      </div>`;
  }

  const MOTIVOS_DESCARTE = {
    conducta_riesgo: 'Olvidó mencionar una conducta de riesgo reciente',
    sintomas: 'Empezó a sentir síntomas (fiebre, malestar) al terminar',
    medicacion: 'Tomó alguna sustancia o medicamento que no declaró',
    presion: 'Vino a donar por presión de terceros, no fue voluntario',
    otro: 'Otro motivo (sin especificar)',
  };

  function verRespuestaF4(token) {
    const f = HemoRed.db.all('formulario_postdonacion').find(x => x.token === token);
    if (!f) return;
    const fecha = f.completado_en ? new Date(f.completado_en).toLocaleString('es-AR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';
    document.getElementById('ver-f4-body').innerHTML = `
      <div class="dato-grid" style="margin-bottom:${f.usar_para_transfusion === false ? '16px' : '0'};">
        <div><div class="dato-label">Tu respuesta</div><div class="dato-value" style="color:${f.usar_para_transfusion ? '#1a6b3a' : '#c0392b'};">${f.usar_para_transfusion ? 'Sí, puede usarse' : 'No, se descartó'}</div></div>
        <div><div class="dato-label">Respondido el</div><div class="dato-value">${fecha}</div></div>
      </div>
      ${f.usar_para_transfusion === false ? `<div><div class="dato-label">Motivo</div><div class="dato-value" style="font-weight:400;">${MOTIVOS_DESCARTE[f.motivo_descarte] || 'Sin especificar'}</div></div>` : ''}
    `;
    HemoRed.ui.abrirModal('modal-ver-f4');
  }

  function renderNotificaciones() {
    const grupos = ['hoy', 'ayer', 'semana', 'antes'];
    document.getElementById('lista-notificaciones').innerHTML = grupos.map(g => {
      const items = notificacionesActuales.filter(n => n.grupo === g);
      if (!items.length) return '';
      return `
        <div class="notif-group">
          <div class="notif-group-title">${TITULOS_GRUPO[g]}</div>
          <div class="notif-list">${items.map(notifItemHTML).join('')}</div>
        </div>`;
    }).join('');
    aplicarFiltro();
  }

  function marcarLeidaUI(id) {
    const n = notificacionesActuales.find(x => x.id === id);
    if (!n || n.leido) return;
    HemoRed.data.marcarNotificacionLeida(id);
    n.leido = true;
    renderNotificaciones();
  }

  function marcarTodasLeidasUI() {
    const s = HemoRed.sesion.get();
    HemoRed.data.marcarTodasNotificacionesLeidas(s.usuario_id);
    notificacionesActuales.forEach(n => n.leido = true);
    renderNotificaciones();
    HemoRed.ui.toast('Todas marcadas como leídas');
  }

  function filtrarNotif(tipo, el) {
    filtroActual = tipo;
    document.querySelectorAll('.tabs .tab').forEach(c => c.classList.remove('active'));
    el.classList.add('active');
    aplicarFiltro();
  }

  function aplicarFiltro() {
    const items = document.querySelectorAll('.notif-item');
    items.forEach(item => {
      if (filtroActual === 'todas') { item.style.display = ''; return; }
      if (filtroActual === 'noleidas') { item.style.display = item.classList.contains('unread') ? '' : 'none'; return; }
      item.style.display = item.dataset.tipo === filtroActual ? '' : 'none';
    });
    document.querySelectorAll('.notif-group').forEach(group => {
      const visibles = group.querySelectorAll('.notif-item:not([style*="display: none"])');
      group.style.display = visibles.length === 0 ? 'none' : '';
    });
    const totalVisibles = document.querySelectorAll('.notif-item:not([style*="display: none"])').length;
    document.getElementById('sin-resultados-notif').classList.toggle('hidden', totalVisibles !== 0);
  }

  document.addEventListener('DOMContentLoaded', cargarYRenderizarNotif);

</script>

  <script src="../js/db.js"></script>
  <script src="../js/sesion.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/data.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => HemoRed.ui.montarSidebarDonante());</script>

</body>
</html>
