<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HemoRed — Profesionales</title>
  <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../estilos/global.css">
  <link rel="stylesheet" href="../estilos/componentes.css">
  <link rel="stylesheet" href="../estilos/hospital.css">




</head>
<body>

<aside class="sidebar" id="sidebar"></aside>

<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="mobile-topbar-btn"><span></span><span></span><span></span></button>
      <div class="topbar-title">Profesionales</div>
    </div>
    <div class="topbar-actions">
      <a class="topbar-btn" href="../hospital/notificaciones.html" data-tooltip="Ir a notificaciones"><i class="ti ti-bell" style="font-size:18px;"></i></a>
      <button class="btn-nueva" onclick="abrirModal()">
        <i class="ti ti-plus"></i>Nuevo profesional
      </button>
    </div>
  </div>

  <div class="content">

    <div class="stats-row" id="profesionales-stats" style="grid-template-columns:repeat(3,1fr);">
      <div class="stat-card">
        <div class="kpi-top">
          <div class="kpi-icon" style="background:#fdf0f3;"><i class="ti ti-stethoscope" style="color:#ef647c;font-size:18px;"></i></div>
          <span class="kpi-trend" id="prof-trend-total"></span>
        </div>
        <div class="stat-num" id="prof-stat-total">—</div>
        <div class="stat-label">Profesionales</div>
        <div class="kpi-sub" id="prof-sub-total">—</div>
      </div>
      <div class="stat-card">
        <div class="kpi-top">
          <div class="kpi-icon" style="background:#e1f5ee;"><i class="ti ti-circle-check" style="color:#27ae60;font-size:18px;"></i></div>
          <span class="kpi-trend" id="prof-trend-activos"></span>
        </div>
        <div class="stat-num" id="prof-stat-activos" style="color:#27ae60;">—</div>
        <div class="stat-label">Activos</div>
        <div class="kpi-sub" id="prof-sub-activos">—</div>
      </div>
      <div class="stat-card">
        <div class="kpi-top">
          <div class="kpi-icon" style="background:#f2f2f2;"><i class="ti ti-circle-x" style="color:#888;font-size:18px;"></i></div>
          <span class="kpi-trend" id="prof-trend-inactivos"></span>
        </div>
        <div class="stat-num" id="prof-stat-inactivos" style="color:#888;">—</div>
        <div class="stat-label">Inactivos</div>
        <div class="kpi-sub" id="prof-sub-inactivos">—</div>
      </div>
    </div>

    <div class="filtros">
      <div class="search-wrap">
        <i class="ti ti-search search-icon"></i>
        <input class="search-input" type="text" placeholder="Buscar por nombre o matrícula..." oninput="filtrarProfesionales()">
      </div>
      <select class="filter-select" id="filtro-especialidad" onchange="filtrarProfesionales()">
        <option value="">Todas las especialidades</option>
      </select>
      <select class="filter-select" onchange="filtrarProfesionales()">
        <option value="">Todos los estados</option>
        <option value="activo">Activos</option>
        <option value="inactivo">Inactivos</option>
      </select>
    </div>

    <div class="prof-grid" id="lista-profesionales">
      <!-- renderizado dinámico vía renderProfesionales() -->
    </div>
    <div id="sin-resultados-prof" style="display:none;padding:40px;text-align:center;color:#a9435d;font-size:14px;">Sin resultados</div>
  </div>
</div>

<!-- MODAL NUEVO PROFESIONAL -->
<div class="modal-overlay" id="modal-nuevo">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Nuevo profesional</div>
      <button class="modal-close" onclick="cerrarModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Nombre</label>
          <input class="form-input" id="np-nombre" type="text" placeholder="Carlos">
        </div>
        <div class="form-group">
          <label class="form-label">Apellido</label>
          <input class="form-input" id="np-apellido" type="text" placeholder="Méndez">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">DNI</label>
        <input class="form-input" id="np-dni" type="text" placeholder="29654321">
        <div style="font-size:11px;color:#a9435d;margin-top:4px;">Si la persona ya trabaja en otro hospital del sistema, no hace falta definir contraseña — se vincula a tu hospital con la cuenta que ya tiene.</div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Perfil</label>
          <select class="form-input" id="np-tipo">
            <option value="" disabled selected>Seleccioná</option>
            <option value="medico">Médico clínico</option>
            <option value="extraccionista">Extraccionista</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Matrícula</label>
          <input class="form-input" id="np-matricula" type="text" placeholder="45.231">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Especialidad</label>
        <select class="form-input" id="np-especialidad">
          <option value="" disabled selected>Seleccioná</option>
          <option>Hematología</option><option>Cardiología</option><option>Oncología</option>
          <option>Cirugía</option><option>Pediatría</option><option>Traumatología</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Email institucional</label>
        <input class="form-input" id="np-email" type="email" placeholder="nombre@hospital.com.ar">
      </div>
      <div class="form-group">
        <label class="form-label">Teléfono / interno <span style="font-weight:400;color:#a9435d;">(opcional)</span></label>
        <input class="form-input" id="np-telefono" type="text" placeholder="011 4127-0200 int. 205">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Contraseña provisoria</label>
          <input class="form-input" id="np-pass" type="password" placeholder="••••••••">
        </div>
        <div class="form-group">
          <label class="form-label">Repetir contraseña</label>
          <input class="form-input" id="np-pass2" type="password" placeholder="••••••••">
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
      <button class="btn-save" onclick="guardarProfesionalUI()">Guardar profesional</button>
    </div>
  </div>
</div>

<script>
  function filtrarProfesionales() {
    const busqueda = document.querySelector('.search-input').value.toLowerCase();
    const selects = document.querySelectorAll('.filtros .filter-select');
    const especialidad = selects[0].value;
    const estado = selects[1].value;
    const cards = document.querySelectorAll('.prof-card');
    let visibles = 0;
    cards.forEach(card => {
      const nombre = (card.dataset.nombre || '').toLowerCase();
      const esp = (card.dataset.especialidad || '').toLowerCase();
      const est = card.dataset.estado || '';
      const matchNombre = !busqueda || nombre.includes(busqueda);
      const matchEsp = !especialidad || esp.includes(especialidad.toLowerCase());
      const matchEstado = !estado || est === estado;
      const mostrar = matchNombre && matchEsp && matchEstado;
      card.style.display = mostrar ? '' : 'none';
      if (mostrar) visibles++;
    });
    document.getElementById('sin-resultados-prof').style.display = visibles === 0 ? 'block' : 'none';
  }
  function abrirModal() {
    limpiarFormNuevoProfesional();
    document.getElementById('modal-nuevo').classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  function cerrarModal() {
    document.getElementById('modal-nuevo').classList.remove('active');
    document.body.style.overflow = '';
  }

  function limpiarFormNuevoProfesional() {
    ['np-nombre', 'np-apellido', 'np-dni', 'np-matricula', 'np-email', 'np-telefono', 'np-pass', 'np-pass2'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('np-tipo').value = '';
    document.getElementById('np-especialidad').value = '';
  }

  // El hospital da de alta un profesional (2026-10-20, mismo pedido que
  // "Creación de pacientes" del mismo día). crearProfesional() busca
  // primero por DNI: si la persona ya trabaja en otro hospital del
  // sistema, solo se crea el vínculo nuevo (con el email institucional de
  // ESTE hospital) — no una cuenta duplicada.
  async function guardarProfesionalUI() {
    const resultado = HemoRed.data.crearProfesional({
      nombre: document.getElementById('np-nombre').value.trim(),
      apellido: document.getElementById('np-apellido').value.trim(),
      numero_documento: document.getElementById('np-dni').value.trim(),
      tipo: document.getElementById('np-tipo').value,
      matricula: document.getElementById('np-matricula').value.trim(),
      especialidad: document.getElementById('np-especialidad').value,
      email: document.getElementById('np-email').value.trim(),
      telefono: document.getElementById('np-telefono').value.trim(),
      password: document.getElementById('np-pass').value,
      password2: document.getElementById('np-pass2').value,
    });
    if (!resultado.ok) {
      HemoRed.ui.toast(resultado.error, 'error');
      return;
    }
    HemoRed.ui.toast(resultado.yaExistia ? 'Profesional vinculado a tu hospital' : 'Profesional creado');
    cerrarModal();
    renderProfesionales();
  }

  // Las 4 tarjetas y las 3 métricas de arriba venían 100% hardcodeadas —
  // conectadas acá 2026-10-14 a HemoRed.data.cargarProfesionalesHospital(),
  // mismo motivo y mismo día que hospital/pacientes.html. El combo de
  // "especialidad" también se arma con las especialidades reales en vez de
  // la lista fija de antes (que ni siquiera incluía "Hemoterapia").
  function renderProfesionales() {
    const { profesionales, total, activos, inactivos } = HemoRed.data.cargarProfesionalesHospital();
    document.getElementById('prof-stat-total').textContent = total;
    document.getElementById('prof-stat-activos').textContent = activos;
    document.getElementById('prof-stat-inactivos').textContent = inactivos;
    const especialidades = [...new Set(profesionales.map(p => p.especialidad).filter(Boolean))].sort();
    document.getElementById('prof-sub-total').textContent = `${especialidades.length} especialidad${especialidades.length === 1 ? '' : 'es'}`;
    document.getElementById('prof-sub-activos').textContent = `${total ? Math.round((activos / total) * 100) : 0}% del total`;
    document.getElementById('prof-sub-inactivos').textContent = `${total ? Math.round((inactivos / total) * 100) : 0}% del total`;
    const trendTotalProf = document.getElementById('prof-trend-total');
    trendTotalProf.textContent = `${especialidades.length} esp.`;
    trendTotalProf.className = 'kpi-trend flat';
    HemoRed.ui.pintarPorcentaje('prof-trend-activos', activos, total, { bg: '#e1f5ee', color: '#27ae60' });
    HemoRed.ui.pintarPorcentaje('prof-trend-inactivos', inactivos, total, { bg: '#f2f2f2', color: '#888' });
    const selectEsp = document.getElementById('filtro-especialidad');
    selectEsp.innerHTML = '<option value="">Todas las especialidades</option>'
      + especialidades.map(e => `<option>${e}</option>`).join('');

    document.getElementById('lista-profesionales').innerHTML = profesionales.map(p => {
      const iniciales = p.nombre_completo.replace(/^(Dr\.|Dra\.)\s*/, '').split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
      const estado = p.activo ? 'activo' : 'inactivo';
      return `
        <div class="prof-card" data-nombre="${p.nombre_completo.toLowerCase()} mat. ${p.matricula}" data-especialidad="${p.especialidad || ''}" data-estado="${estado}" onclick="window.location='../hospital/profesional_detalle.html'">
          <div class="prof-card-header">
            <div class="prof-avatar">${iniciales}</div>
            <div>
              <div class="prof-name">${p.nombre_completo}</div>
              <div class="prof-especialidad">${p.especialidad || '—'}</div>
            </div>
          </div>
          <div class="prof-datos">
            <div class="prof-dato"><i class="ti ti-id-badge" style="color:#ef647c;font-size:14px;"></i>Mat. ${p.matricula}</div>
            <div class="prof-dato"><i class="ti ti-mail" style="color:#ef647c;font-size:14px;"></i>${p.email_institucional || p.usuario?.email || '—'}</div>
            <div class="prof-dato"><i class="ti ti-phone" style="color:#ef647c;font-size:14px;"></i>${p.usuario?.telefono || '—'}</div>
          </div>
          <div class="prof-footer">
            <span class="prof-badge ${p.activo ? 'badge-activo' : 'badge-inactivo'}">${p.activo ? '● Activo' : '○ Inactivo'}</span>
            <div class="prof-actions">
              <button class="btn-xs btn-xs-outline" onclick="event.stopPropagation();window.location='../hospital/profesional_detalle.html'">Ver</button>
            </div>
          </div>
        </div>`;
    }).join('');
  }

  document.addEventListener('DOMContentLoaded', async () => {
    HemoRed.sesion.requerirLogin('hospital');
    await HemoRed.db.init();
    renderProfesionales();
  });
</script>

  <script src="../js/db.js"></script>
  <script src="../js/sesion.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/data.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => HemoRed.ui.montarSidebarHospital());</script>

</body>
</html>
