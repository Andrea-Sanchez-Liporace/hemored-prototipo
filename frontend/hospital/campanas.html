<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HemoRed — Campañas</title>
  <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="stylesheet" href="../estilos/global.css">
  <link rel="stylesheet" href="../estilos/componentes.css">
  <link rel="stylesheet" href="../estilos/hospital.css">




</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar"></aside>

<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="main">
  <div class="topbar">
    <div class="topbar-left">
      <button class="mobile-topbar-btn"><span></span><span></span><span></span></button>
      <div class="topbar-title">Campañas</div>
    </div>
    <div class="topbar-actions">
      <a class="topbar-btn" href="../hospital/notificaciones.html" data-tooltip="Ir a notificaciones"><i class="ti ti-bell" style="font-size:18px;"></i></a>
      <button class="btn-nueva" onclick="window.location='../hospital/nueva_campana.html'">
        <i class="ti ti-plus"></i>Nueva campaña
      </button>
    </div>
  </div>

  <div class="content">

    <!-- BANNER PACIENTE (se muestra solo cuando viene con ?paciente=...) -->
    <div id="paciente-banner" style="display:none;background:#fdf0f3;border:1px solid #f28b98;border-radius:12px;padding:14px 20px;margin-bottom:20px;display:none;align-items:center;justify-content:space-between;gap:12px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:36px;height:36px;border-radius:9px;background:#5a1e37;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
          <i class="ti ti-user" style="color:white;font-size:16px;"></i>
        </div>
        <div>
          <div style="font-size:13px;font-weight:500;color:#5a1e37;" id="banner-titulo">Campañas del paciente</div>
          <div style="font-size:11px;color:#a9435d;" id="banner-sub">Mostrando solo campañas asociadas a este paciente</div>
        </div>
      </div>
      <button onclick="volverPaciente()" style="display:flex;align-items:center;gap:6px;background:white;color:#5a1e37;border:1.5px solid #e8d0d8;padding:7px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;">
        <i class="ti ti-arrow-left" style="font-size:12px;"></i>Volver al paciente
      </button>
    </div>

    <!-- STATS — solo informativas, el filtro está en las pestañas de abajo -->
    <div class="stats-row">
      <div class="stat-chip">
        <div class="kpi-top">
          <div class="kpi-icon" style="background:#fdf0f3;"><i class="ti ti-speakerphone" style="color:#5a1e37;font-size:18px;"></i></div>
          <span class="kpi-trend" id="trend-todas"></span>
        </div>
        <div class="stat-chip-num" id="stat-todas">—</div>
        <div class="stat-chip-label">Todas</div>
        <div class="kpi-sub" id="sub-todas">—</div>
      </div>
      <div class="stat-chip">
        <div class="kpi-top">
          <div class="kpi-icon" style="background:#e1f5ee;"><i class="ti ti-circle-check" style="color:#27ae60;font-size:18px;"></i></div>
          <span class="kpi-trend" id="trend-activa"></span>
        </div>
        <div class="stat-chip-num" style="color:#27ae60;" id="stat-activa">—</div>
        <div class="stat-chip-label">Activas</div>
        <div class="kpi-sub" id="sub-activa">—</div>
      </div>
      <div class="stat-chip">
        <div class="kpi-top">
          <div class="kpi-icon" style="background:#efeefd;"><i class="ti ti-calendar-time" style="color:#7f77dd;font-size:18px;"></i></div>
          <span class="kpi-trend" id="trend-programada"></span>
        </div>
        <div class="stat-chip-num" style="color:#7f77dd;" id="stat-programada">—</div>
        <div class="stat-chip-label">Programadas</div>
        <div class="kpi-sub" id="sub-programada">—</div>
      </div>
      <div class="stat-chip">
        <div class="kpi-top">
          <div class="kpi-icon" style="background:#fdf3e8;"><i class="ti ti-player-pause" style="color:#e67e22;font-size:18px;"></i></div>
          <span class="kpi-trend" id="trend-pausada"></span>
        </div>
        <div class="stat-chip-num" style="color:#e67e22;" id="stat-pausada">—</div>
        <div class="stat-chip-label">Pausadas</div>
        <div class="kpi-sub" id="sub-pausada">—</div>
      </div>
      <div class="stat-chip">
        <div class="kpi-top">
          <div class="kpi-icon" style="background:#fdf0f3;"><i class="ti ti-lock" style="color:#a9435d;font-size:18px;"></i></div>
          <span class="kpi-trend" id="trend-cerrada"></span>
        </div>
        <div class="stat-chip-num" style="color:#a9435d;" id="stat-cerrada">—</div>
        <div class="stat-chip-label">Cerradas</div>
        <div class="kpi-sub" id="sub-cerrada">—</div>
      </div>
      <div class="stat-chip">
        <div class="kpi-top">
          <div class="kpi-icon" style="background:#f2f2f2;"><i class="ti ti-file-pencil" style="color:#888;font-size:18px;"></i></div>
          <span class="kpi-trend" id="trend-borrador"></span>
        </div>
        <div class="stat-chip-num" style="color:#888;" id="stat-borrador">—</div>
        <div class="stat-chip-label">Borradores</div>
        <div class="kpi-sub" id="sub-borrador">—</div>
      </div>
    </div>

    <!-- FILTRO POR ESTADO — mismo componente .tabs que ya usa Documentación -->
    <div class="tabs" id="tabs-estado-campana">
      <button class="tab active" onclick="filtrarEstado('todas', this)">Todas<span class="tab-badge" id="tabbadge-todas">0</span></button>
      <button class="tab" onclick="filtrarEstado('activa', this)">Activas<span class="tab-badge" id="tabbadge-activa">0</span></button>
      <button class="tab" onclick="filtrarEstado('programada', this)">Programadas<span class="tab-badge" id="tabbadge-programada">0</span></button>
      <button class="tab" onclick="filtrarEstado('pausada', this)">Pausadas<span class="tab-badge" id="tabbadge-pausada">0</span></button>
      <button class="tab" onclick="filtrarEstado('cerrada', this)">Cerradas<span class="tab-badge" id="tabbadge-cerrada">0</span></button>
      <button class="tab" onclick="filtrarEstado('borrador', this)">Borradores<span class="tab-badge" id="tabbadge-borrador">0</span></button>
    </div>

    <!-- FILTROS -->
    <div class="filtros">
      <div class="search-wrap">
        <i class="ti ti-search search-icon"></i>
        <input class="search-input" type="text" placeholder="Buscar campaña..." oninput="aplicarFiltrosCampanas()">
      </div>
      <select class="filter-select" onchange="aplicarFiltrosCampanas()">
        <option value="">Todos los tipos de sangre</option>
        <option>A+</option><option>A-</option>
        <option>B+</option><option>B-</option>
        <option>0+</option><option>0-</option>
        <option>AB+</option><option>AB-</option>
      </select>
      <select class="filter-select">
        <option>Ordenar por</option>
        <option>Más recientes</option>
        <option>Fecha límite más próxima</option>
        <option>Mayor urgencia</option>
        <option>Más cupos libres</option>
      </select>
    </div>

    <!-- TABLA -->
    <div class="table-wrap">
      <div class="table-header">
        <div class="th">Campaña</div>
        <div class="th">Estado</div>
        <div class="th hide-md">Tipo sangre</div>
        <div class="th hide-md">Cupos</div>
        <div class="th">Fecha límite</div>
        <div class="th"></div>
      </div>

      <div id="filas-campanas"></div>

      <div id="sin-resultados-camp" style="display:none;padding:40px;text-align:center;color:#a9435d;font-size:14px;">Sin resultados</div>
    </div>

    <!-- PAGINACIÓN: sin paginado real todavía (pocas campañas por hospital
         en este prototipo) — se deja el conteo real, sin las páginas. -->
    <div class="pagination">
      <div class="pag-info" id="pag-info-camp">Mostrando 0 de 0 campañas</div>
    </div>

  </div>
</div>

<script src="../js/db.js"></script>
<script src="../js/sesion.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/data.js"></script>
<script>document.addEventListener('DOMContentLoaded', () => HemoRed.ui.montarSidebarHospital());</script>


<script>
  var _filtroEstadoCamp = 'todas';
  var _campanas = [];
  var _pacienteFiltroId = null;

  const ESTADO_INFO = {
    activa:     { badge: 'estado-activa',     icon: '●', label: 'Activa' },
    programada: { badge: 'estado-programada', icon: '◷', label: 'Programada' },
    pausada:    { badge: 'estado-pausada',     icon: '⏸', label: 'Pausada' },
    cerrada:    { badge: 'estado-cerrada',     icon: '✓', label: 'Cerrada' },
    borrador:   { badge: 'estado-borrador',    icon: '✎', label: 'Borrador' },
  };

  function hace(fechaISO) {
    const dias = Math.floor((HemoRed.data.ahora() - new Date(fechaISO)) / 86400000);
    if (dias <= 0) return 'hoy';
    if (dias === 1) return 'hace 1 día';
    if (dias < 7) return `hace ${dias} días`;
    if (dias < 14) return 'hace 1 semana';
    return `hace ${Math.floor(dias / 7)} semanas`;
  }

  function subtextoCampana(c, paciente) {
    const quien = paciente ? `Paciente: ${paciente.nombre} ${paciente.apellido}` : 'Campaña genérica';
    if (c.estado === 'borrador') return `Borrador · Última edición ${hace(c.creado_en)}`;
    if (c.estado === 'programada') {
      const f = new Date(c.fecha_publicacion);
      return `Se publica el ${f.toLocaleDateString('es-AR', { day: 'numeric', month: 'short' })} a las ${f.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' })}hs`;
    }
    return `${quien} · Creada ${hace(c.creado_en)}`;
  }

  function accionesCampana(c) {
    switch (c.estado) {
      case 'borrador': return `
        <button class="btn-xs btn-xs-outline" onclick="window.location='../hospital/nueva_campana.html?id=${c.id}'">Editar</button>
        <button class="btn-xs btn-xs-danger" onclick="accionEliminar(${c.id})">Eliminar</button>`;
      case 'programada': return `
        <button class="btn-xs btn-xs-outline" onclick="verCampana(${c.id})">Ver</button>
        <button class="btn-xs btn-xs-outline" onclick="window.location='../hospital/nueva_campana.html?id=${c.id}'">Editar</button>`;
      case 'activa': return `
        <button class="btn-xs btn-xs-outline" onclick="verCampana(${c.id})">Ver</button>
        <button class="btn-xs btn-xs-pause" onclick="accionPausar(${c.id})">Pausar</button>`;
      case 'pausada': return `
        <button class="btn-xs btn-xs-outline" onclick="verCampana(${c.id})">Ver</button>
        <button class="btn-xs btn-xs-activate" onclick="accionReactivar(${c.id})">Reactivar</button>`;
      case 'cerrada': return `
        <button class="btn-xs btn-xs-outline" onclick="verCampana(${c.id})">Ver</button>`;
      default: return '';
    }
  }

  function verCampana(id) {
    window.location = '../hospital/campana_detalle.html?id=' + id;
  }

  function filaCampana(c) {
    const paciente = c.paciente_id ? HemoRed.db.find('pacientes', c.paciente_id) : null;
    const info = ESTADO_INFO[c.estado] || ESTADO_INFO.borrador;
    const pct = c.unidades_requeridas ? Math.round((c.unidades_obtenidas / c.unidades_requeridas) * 100) : 0;
    const fechaLimite = c.fecha_cierre ? new Date(c.fecha_cierre + 'T00:00:00').toLocaleDateString('es-AR', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
    const urgenteTag = c.urgente ? `<span style="display:inline-flex;align-items:center;gap:3px;background:#fde8e8;color:#c0392b;font-size:10px;font-weight:500;padding:1px 6px;border-radius:10px;margin-left:4px;vertical-align:middle;"><i class="ti ti-flame" style="font-size:10px;"></i>Urgente</span>` : '';
    const sangreTexto = c.tipo_sangre_requerida || 'Todos';
    return `<div class="table-row" data-estado="${c.estado}" data-nombre="${c.titulo.toLowerCase()}" data-sangre="${sangreTexto.toLowerCase()}">
      <div>
        <div class="camp-name">${c.titulo}${urgenteTag}</div>
        <div class="camp-sub">${subtextoCampana(c, paciente)}</div>
      </div>
      <div class="td"><span class="estado-badge ${info.badge}">${info.icon} ${info.label}</span></div>
      <div class="td hide-md">${sangreTexto}</div>
      <div class="td hide-md">${c.unidades_obtenidas}/${c.unidades_requeridas}<div class="progress-mini"><div class="progress-mini-fill" style="width:${pct}%;"></div></div></div>
      <div class="td">${fechaLimite}</div>
      <div class="row-actions">${accionesCampana(c)}</div>
    </div>`;
  }

  function renderCampanas() {
    let lista = _pacienteFiltroId ? _campanas.filter(c => c.paciente_id === _pacienteFiltroId) : _campanas;

    document.getElementById('stat-todas').textContent = lista.length;
    const urgentes = lista.filter(c => c.urgente).length;
    document.getElementById('sub-todas').textContent = urgentes ? `${urgentes} urgente${urgentes === 1 ? '' : 's'}` : 'Ninguna urgente';
    document.getElementById('trend-todas').innerHTML = urgentes
      ? `<i class="ti ti-alert-triangle" style="font-size:10px;"></i>${urgentes} urgente${urgentes === 1 ? '' : 's'}`
      : '<i class="ti ti-check" style="font-size:10px;"></i>sin urgencias';
    document.getElementById('trend-todas').className = 'kpi-trend ' + (urgentes ? 'down' : 'up');

    // Mismo color que ya tiene cada ícono/número de estado, para que el
    // badge combine con el resto de la tarjeta.
    const colorPorEstado = {
      activa: { bg: '#e1f5ee', color: '#27ae60' },
      programada: { bg: '#efeefd', color: '#7f77dd' },
      pausada: { bg: '#fdf3e8', color: '#e67e22' },
      cerrada: { bg: '#fdf0f3', color: '#a9435d' },
      borrador: { bg: '#f2f2f2', color: '#888' },
    };
    ['activa', 'programada', 'pausada', 'cerrada', 'borrador'].forEach(estado => {
      const n = lista.filter(c => c.estado === estado).length;
      document.getElementById('stat-' + estado).textContent = n;
      document.getElementById('sub-' + estado).textContent = `${lista.length ? Math.round((n / lista.length) * 100) : 0}% del total`;
      HemoRed.ui.pintarPorcentaje('trend-' + estado, n, lista.length, colorPorEstado[estado]);
      document.getElementById('tabbadge-' + estado).textContent = n;
    });
    document.getElementById('tabbadge-todas').textContent = lista.length;

    document.getElementById('filas-campanas').innerHTML = lista.map(filaCampana).join('');
    aplicarFiltrosCampanas();
  }

  function filtrarEstado(estado, el) {
    document.querySelectorAll('#tabs-estado-campana .tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    _filtroEstadoCamp = estado;
    aplicarFiltrosCampanas();
  }

  function aplicarFiltrosCampanas() {
    const busqueda = document.querySelector('.search-input').value.toLowerCase();
    const selects = document.querySelectorAll('.filter-select');
    const sangre = selects[0].value;
    const rows = document.querySelectorAll('.table-row');
    let visibles = 0;
    rows.forEach(row => {
      const matchEstado = _filtroEstadoCamp === 'todas' || row.dataset.estado === _filtroEstadoCamp;
      const nombre = (row.dataset.nombre || '');
      const sangreRow = (row.dataset.sangre || '');
      const matchBusqueda = !busqueda || nombre.includes(busqueda);
      const matchSangre = !sangre || sangreRow === sangre.toLowerCase() || sangreRow === 'todos';
      const mostrar = matchEstado && matchBusqueda && matchSangre;
      row.style.display = mostrar ? '' : 'none';
      if (mostrar) visibles++;
    });
    const sr = document.getElementById('sin-resultados-camp');
    if (sr) sr.style.display = visibles === 0 ? 'block' : 'none';
    const pi = document.getElementById('pag-info-camp');
    if (pi) pi.textContent = `Mostrando ${visibles} de ${rows.length} campañas`;
  }

  async function accionPausar(id) {
    const res = HemoRed.data.pausarCampana(id);
    if (!res.ok) { HemoRed.ui.toast(res.error, 'error'); return; }
    HemoRed.ui.toast('Campaña pausada');
    recargar();
  }
  async function accionReactivar(id) {
    const res = HemoRed.data.reactivarCampana(id);
    if (!res.ok) { HemoRed.ui.toast(res.error, 'error'); return; }
    HemoRed.ui.toast('Campaña reactivada');
    recargar();
  }
  async function accionEliminar(id) {
    if (!confirm('¿Eliminar este borrador? No se puede deshacer.')) return;
    const res = HemoRed.data.eliminarBorrador(id);
    if (!res.ok) { HemoRed.ui.toast(res.error, 'error'); return; }
    HemoRed.ui.toast('Borrador eliminado');
    recargar();
  }

  function recargar() {
    _campanas = HemoRed.data.cargarCampanasHospital(_hospitalId);
    renderCampanas();
  }

  var _hospitalId = null;

  async function init() {
    await HemoRed.db.init();
    const s = HemoRed.sesion.get();
    if (!s) return;
    const usuario = HemoRed.db.find('usuarios', s.usuario_id);
    _hospitalId = usuario?.hospital_id;

    const params = new URLSearchParams(window.location.search);
    const pacienteNombre = params.get('paciente');
    const pacienteId = params.get('id');
    if (pacienteNombre) {
      _pacienteFiltroId = Number(pacienteId) || null;
      const banner = document.getElementById('paciente-banner');
      banner.style.display = 'flex';
      document.getElementById('banner-titulo').textContent = 'Campañas de ' + pacienteNombre;
      document.getElementById('banner-sub').textContent = pacienteId ? 'ID #' + pacienteId + ' · Solo campañas asociadas a este paciente' : 'Solo campañas asociadas a este paciente';
    }

    recargar();
  }


  function volverPaciente() {
    window.history.back();
  }

  init();
</script>

</body>
</html>
